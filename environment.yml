name: heritage-cv
channels:
  - pytorch
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pip
  - pytorch>=2.1.0
  - torchvision>=0.16.0
  - numpy>=1.24
  - pillow
  - scipy
  - matplotlib
  - scikit-learn
  - scikit-image
  - tqdm
  - pyyaml
  - pip:
    - albumentations>=1.3.0
    - segmentation-models-pytorch>=0.3.3
    - ultralytics>=8.0.0
    - grad-cam>=1.4.8
    - opencv-python-headless>=4.8.0
    - timm>=0.9.0
    - torchmetrics>=1.0.0
    - pandas
    - jupyterlab
    - ipywidgets
    - kaggle
